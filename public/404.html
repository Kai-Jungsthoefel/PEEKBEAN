    <meta name="color-scheme" content="light dark" />

    <title>Page not found | Peekbean</title>
    <!-- Served for every unknown address, also nested ones, so everything is inline and every link absolute. -->
    <style>
      :root { --bg: #f3f4f6; --tx: #1b1e23; --tx2: #525b66; --line: #d3d8de; --acc: #f29a38; --acc-ink: #1b1206; }
      @media (prefers-color-scheme: dark) { :root { --bg: #121417; --tx: #e6e8eb; --tx2: #a3acb6; --line: #2d323a; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--tx); font: 16px/1.5 'Segoe UI', system-ui, sans-serif; }
      main { max-width: 420px; padding: 32px 16px; text-align: center; }
      svg { display: block; margin: 0 auto 28px; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      p { color: var(--tx2); margin: 0 0 28px; }
      a { display: inline-block; padding: 10px 20px; border-radius: 8px; background: var(--acc); color: var(--acc-ink); font-weight: 600; text-decoration: none; }
      a:hover { filter: brightness(1.06); }
      a.plain { background: none; color: var(--tx2); border: 1px solid var(--line); margin-left: 8px; font-weight: 500; }
    </style>
  </head>
